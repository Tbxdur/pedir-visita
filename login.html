<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso equipo — Manitas de Confianza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#23262B;
    --paper:#ECE6D8;
    --paper-dark:#DCD3BE;
    --amber:#E3A008;
    --amber-dark:#B87F04;
    --rust:#B4402C;
    --steel:#5C6670;
    --pine:#2F5233;
    --white:#FBF9F4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--ink);color:var(--ink);
    font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px;}
  .brand-name{font-family:'Oswald',sans-serif;font-weight:600;font-size:1.15rem;color:var(--white);letter-spacing:.02em;}
  .brand-sub{font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:var(--amber);letter-spacing:.08em;text-align:center;}
  .card{
    width:100%;max-width:360px;background:var(--white);border-radius:10px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);padding:28px 26px 26px;
  }
  h1{font-family:'Oswald',sans-serif;font-size:1.15rem;margin:0 0 4px;}
  .sub{color:var(--steel);font-size:.85rem;margin-bottom:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.78rem;color:var(--steel);margin-bottom:5px;font-weight:600;}
  input{
    width:100%;border:1.5px solid var(--paper-dark);border-radius:8px;
    padding:12px 13px;font-family:'Inter',sans-serif;font-size:.95rem;background:var(--paper);color:var(--ink);
  }
  input:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber-dark);}
  .submit-btn{
    width:100%;margin-top:8px;padding:14px;border:none;border-radius:8px;
    background:var(--amber);color:var(--ink);font-family:'Oswald',sans-serif;
    font-weight:600;font-size:.98rem;cursor:pointer;
  }
  .submit-btn:disabled{opacity:.6;cursor:default;}
  .submit-btn:active{background:var(--amber-dark);}
  .error-msg{color:var(--rust);font-size:.82rem;margin-top:12px;font-weight:600;text-align:center;}
  .back{display:block;text-align:center;margin-top:18px;color:var(--steel);font-size:.8rem;text-decoration:none;}
</style>
</head>
<body>
<div>
  <div class="brand">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M14.7 6.3a4 4 0 00-5.4 4.9L3 17.5V21h3.5l6.3-6.3a4 4 0 004.9-5.4l-2.6 2.6-2-2 2.6-2.6z" stroke="#E3A008" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <div>
      <div class="brand-name">Manitas de Confianza</div>
    </div>
  </div>
  <div class="card">
    <h1>Acceso del equipo</h1>
    <div class="sub">Entra con tu cuenta para ver tus solicitudes.</div>
    <form id="loginForm">
      <div class="field"><label>Correo electrónico</label><input type="email" id="email" autocomplete="username" required></div>
      <div class="field"><label>Contraseña</label><input type="password" id="password" autocomplete="current-password" required></div>
      <button type="submit" class="submit-btn">Entrar</button>
      <div id="errorMsg" class="error-msg" hidden></div>
    </form>
    <a class="back" href="index.html">← Volver al formulario de clientes</a>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://pxknaepakigpxymvtmct.supabase.co';
const SUPABASE_KEY = 'sb_publishable_HII4AujHp7KMr27zLS3_Gw_kaM7jhB4';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
window.__supabase = supabase;

function $(id){ return document.getElementById(id); }

async function redirectIfLoggedIn(){
  const { data: { session } } = await supabase.auth.getSession();
  if(session){
    window.location.href = 'panel.html';
  }
}
redirectIfLoggedIn();

const form = $('loginForm');
const errorMsg = $('errorMsg');
const submitBtn = form.querySelector('.submit-btn');

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  errorMsg.hidden = true;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Entrando...';

  const email = $('email').value.trim();
  const password = $('password').value;

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if(error){
    errorMsg.textContent = 'Correo o contraseña incorrectos.';
    errorMsg.hidden = false;
    submitBtn.disabled = false;
    submitBtn.textContent = 'Entrar';
    return;
  }

  const { data: profile, error: profErr } = await supabase
    .from('profiles')
    .select('activo')
    .eq('id', data.user.id)
    .single();

  if(profErr || !profile || !profile.activo){
    await supabase.auth.signOut();
    errorMsg.textContent = 'Tu cuenta no está activa. Contacta con el administrador.';
    errorMsg.hidden = false;
    submitBtn.disabled = false;
    submitBtn.textContent = 'Entrar';
    return;
  }

  window.location.href = 'panel.html';
});
</script>
</body>
</html>
